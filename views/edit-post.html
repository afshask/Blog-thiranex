<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Post - Blog Platform</title>

    <link rel="stylesheet" href="/css/edit-post.css">
</head>

<body>

    <nav class="navbar">

        <h1>My Blog</h1>

        <a href="/">← Back to Blog</a>

    </nav>


    <main class="form-container">

        <h2>Edit Post</h2>

        <form id="editPostForm">

            <input
                type="text"
                id="title"
                placeholder="Post title"
                required
            >

            <textarea
                id="content"
                placeholder="Write your post..."
                rows="10"
                required
            ></textarea>

            <button type="submit">
                Update Post
            </button>

        </form>

        <p id="message"></p>

    </main>


    <script src="/js/edit-post.js"></script>

</body>

</html>
